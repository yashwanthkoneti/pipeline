[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-audit"
version = "0.1.0"
description = "Two-stage LLM audit of a policy-retrieval agent"
requires-python = ">=3.9"
dependencies = ["pandas>=1.3", "numpy>=1.21", "python-dotenv>=1.0"]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
# only needed if you turn on semantic span location; numpy is used
# otherwise and gives the same answer at a few dozen passages per row
faiss = ["faiss-cpu>=1.7"]
dev = ["pytest>=7"]

[project.scripts]
policy-audit = "policy_audit.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
